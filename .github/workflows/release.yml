name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99"

jobs:
  release-linux:
    name: Linux ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build CLI (release)
        run: cargo build --release --locked

      - name: Stage CLI binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp target/release/dnsrace "dist/dnsrace-${version}-${{ matrix.target }}"
          chmod +x "dist/dnsrace-${version}-${{ matrix.target }}"

      - name: Build GUI (release)
        run: cargo build --release --locked --features gui

      - name: Stage GUI binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp target/release/dnsrace "dist/dnsrace-${version}-${{ matrix.target }}-gui"
          chmod +x "dist/dnsrace-${version}-${{ matrix.target }}-gui"

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: dnsrace-linux-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build CLI (release)
        run: cargo build --release --locked

      - name: Stage CLI binary
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/dnsrace.exe "dist/dnsrace-$version-x86_64-pc-windows-msvc.exe"

      - name: Build GUI (release)
        run: cargo build --release --locked --features gui

      - name: Stage GUI binary
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Copy-Item target/release/dnsrace.exe "dist/dnsrace-$version-x86_64-pc-windows-msvc-gui.exe"

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: dnsrace-windows-x86_64
          path: dist/
          if-no-files-found: error

  release-macos:
    name: macOS ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build CLI (release)
        run: cargo build --release --locked

      - name: Stage CLI binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp target/release/dnsrace "dist/dnsrace-${version}-${{ matrix.target }}"
          chmod +x "dist/dnsrace-${version}-${{ matrix.target }}"

      - name: Build GUI (release)
        run: cargo build --release --locked --features gui

      - name: Stage GUI binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp target/release/dnsrace "dist/dnsrace-${version}-${{ matrix.target }}-gui"
          chmod +x "dist/dnsrace-${version}-${{ matrix.target }}-gui"

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: dnsrace-macos-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [release-linux, release-windows, release-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum dnsrace-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: dnsrace ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            # dnsrace ${{ github.ref_name }}

            ## What's New
            - **Graphical user interface**: `--gui` opens a native desktop window with settings, live progress, results, and copy-to-clipboard.
            - **DNS-over-HTTPS (DoH)**: `--doh` adds Cloudflare DoH and Google DoH as testable servers.
            - **TCP DNS**: `--tcp` sends DNS queries over TCP instead of UDP.
            - **Multiple hostnames**: pass several `HOSTNAME` arguments for steering checks.
            - **Enhanced statistics**: `--verbose` now shows mean, max, and p99 latency.
            - **File export**: `--export-json`, `--export-csv`, `--export-html` write results to disk.
            - **HTML report**: `--export-html` produces a styled HTML report.

            ## Downloads
            Each platform has a CLI build and a GUI build. Files ending in `-gui` include the desktop interface and also support all CLI flags.

            Verify downloads with the attached `SHA256SUMS.txt`:

            ```sh
            sha256sum -c SHA256SUMS.txt
            ```

            See [CHANGELOG.md](https://github.com/Yousef-Mohamed22/dnsrace/blob/main/CHANGELOG.md) for the full changelog.
          draft: false
          prerelease: false
          files: |
            dist/dnsrace-*
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
