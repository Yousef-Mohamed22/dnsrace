<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="dnsrace">
  <defs>
    <linearGradient id="signal" gradientUnits="userSpaceOnUse" x1="52" y1="198" x2="170" y2="82">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#2DCCD2"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- Deep-ink tile with a cool border so the mark stays visible on dark launchers. -->
  <rect x="8" y="8" width="240" height="240" rx="62" fill="#0E1A2C"/>
  <rect x="8" y="8" width="240" height="240" rx="62" fill="none" stroke="#26364F" stroke-width="3"/>
  <!-- Three ascending signal bars: bold enough to read at 16 px. -->
  <rect x="52" y="146" width="30" height="52" rx="8" fill="url(#signal)"/>
  <rect x="96" y="116" width="30" height="82" rx="8" fill="url(#signal)"/>
  <rect x="140" y="82" width="30" height="116" rx="8" fill="url(#signal)"/>
  <!-- Mint pulse dot. -->
  <circle cx="198" cy="58" r="15" fill="#34D399"/>
</svg>
