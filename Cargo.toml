[package]
name = "dnsrace"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
description = "Race DNS servers from your own connection and find the fastest one for your location"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Yousef-Mohamed22/dnsrace"
homepage = "https://github.com/Yousef-Mohamed22/dnsrace"
keywords = ["dns", "benchmark", "latency", "network", "cli", "gui"]
categories = ["command-line-utilities", "network-programming", "gui"]

[features]
default = []
gui = ["dep:eframe"]

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
ureq = { version = "2.12", features = ["native-certs"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies.eframe]
version = "0.37"
optional = true
default-features = false
features = [
    "glow",
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "x11",
]

[target.'cfg(target_os = "windows")'.dependencies.eframe]
version = "0.37"
optional = true
default-features = false
features = ["wgpu", "accesskit", "clipboard", "default_fonts", "links", "system_fonts"]

[target.'cfg(target_os = "macos")'.dependencies.eframe]
version = "0.37"
optional = true
default-features = false
features = ["wgpu", "accesskit", "clipboard", "default_fonts", "links", "system_fonts"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "dnsrace"
path = "src/main.rs"
