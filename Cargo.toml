[package]
name = "dnsrace"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
description = "Race DNS servers from your own connection and find the fastest one for your location"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Yousef-Mohamed22/dnsrace"
homepage = "https://github.com/Yousef-Mohamed22/dnsrace"
keywords = ["dns", "benchmark", "latency", "network", "cli", "gui"]
categories = ["command-line-utilities", "network-programming", "gui"]

[features]
default = []
gui = ["eframe", "egui", "serde"]

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
ureq = { version = "2.12", features = ["native-certs"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies.eframe]
version = "0.29"
optional = true
features = ["glow"]

[target.'cfg(target_os = "windows")'.dependencies.eframe]
version = "0.29"
optional = true
features = ["wgpu"]

[target.'cfg(target_os = "macos")'.dependencies.eframe]
version = "0.29"
optional = true
features = ["wgpu"]

[target.'cfg(target_os = "linux")'.dependencies.egui]
version = "0.29"
optional = true

[target.'cfg(target_os = "windows")'.dependencies.egui]
version = "0.29"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.egui]
version = "0.29"
optional = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "dnsrace"
path = "src/main.rs"
