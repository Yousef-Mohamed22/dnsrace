[package]
name = "dnsrace"
version = "0.2.0"
edition = "2021"
description = "Race DNS servers from your own connection and find the fastest one for your location"
license = "MIT"
readme = "README.md"
keywords = ["dns", "benchmark", "network", "latency"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
ureq = { version = "2", features = ["native-certs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
